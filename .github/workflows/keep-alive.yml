name: Keep Supabase alive

# Les projets Supabase gratuits sont mis en pause après 7 jours SANS activité
# base de données. Ce workflow provoque chaque jour une vraie requête SQL.
#
# Pourquoi appeler le SITE plutôt que Supabase directement : l'ancienne version
# pingait l'API Supabase avec des secrets `SUPABASE_URL` / `SUPABASE_ANON_KEY`
# qui n'ont jamais été renseignés → le job sortait en `exit 0` avec un ✅ vert
# sans rien pinger, et le projet a fini en pause quand même (sept. 2026).
# Ici, aucun secret n'est requis : la page /i/<token> est en `force-dynamic` et
# exécute `getInvitationByToken` AVANT de renvoyer 404 → Supabase est réellement
# interrogé à chaque appel. Impossible de « réussir » sans rien faire.
#
# ⚠️ GitHub désactive les workflows planifiés après ~60 jours sans commit sur le
# dépôt. Si tu reçois un mail « scheduled workflow disabled », réactive-le
# depuis l'onglet Actions (un clic) — sinon la mise en pause peut revenir.
#
# URL personnalisable : Settings → Secrets and variables → Actions → Variables,
# créer `SITE_URL` (ex. https://laura-et-jordan.com).

on:
  schedule:
    - cron: '0 6 * * *' # tous les jours à 06:00 UTC (marge large sur les 7 jours)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller la base via le site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://laura-et-jordan.vercel.app' }}
        run: |
          set -euo pipefail
          url="${SITE_URL%/}/i/keep-alive-ping"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 \
                   --retry 2 --retry-delay 5 "$url" || echo "000")
          echo "GET $url → HTTP $code"
          case "$code" in
            200|404)
              # 404 = token inexistant, mais la requête Supabase a bien eu lieu.
              echo "✅ Requête base exécutée — projet Supabase maintenu actif."
              ;;
            *)
              echo "❌ Réponse inattendue ($code)."
              echo "   Soit le site est indisponible, soit le projet Supabase est"
              echo "   en pause → vérifier https://supabase.com/dashboard"
              exit 1
              ;;
          esac
