name: Keep Supabase alive

# Les projets Supabase gratuits sont mis en pause après 7 jours SANS activité
# base. Ce workflow appelle chaque jour `/api/health`, qui effectue une vraie
# lecture Postgres → le projet reste actif.
#
# Historique : la 1re version pingait l'API Supabase avec des secrets
# `SUPABASE_URL` / `SUPABASE_ANON_KEY` jamais renseignés → le job sortait en
# `exit 0` avec un ✅ vert sans rien pinger, et le projet a fini en pause quand
# même (sept. 2026). Ici, aucun secret : impossible de « réussir » sans rien
# faire, et un 503 (base KO) fait échouer le job au lieu de passer inaperçu.
#
# ⚠️ GitHub désactive les workflows planifiés après 60 jours SANS COMMIT sur un
# dépôt public. Le projet étant figé jusqu'au mariage, ce workflow finira par
# être désactivé : un pinger externe (cron-job.org) prend le relais sur la même
# URL `/api/health`. Si un mail « scheduled workflow disabled » arrive, il
# suffit de le réactiver en un clic depuis l'onglet Actions.
#
# URL personnalisable : Settings → Secrets and variables → Actions → Variables,
# créer `SITE_URL` (ex. https://laura-et-jordan.com).

on:
  schedule:
    - cron: '0 6 * * *' # tous les jours à 06:00 UTC (marge large sur les 7 jours)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller la base via /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://laura-et-jordan.vercel.app' }}
        run: |
          set -euo pipefail
          url="${SITE_URL%/}/api/health"
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' -m 30 \
                   --retry 2 --retry-delay 5 "$url" || echo "000")
          echo "GET $url → HTTP $code"
          echo "Réponse : $(cat "$body")"
          if [ "$code" = "200" ]; then
            echo "✅ Lecture base OK — projet Supabase maintenu actif."
            exit 0
          fi
          echo "❌ Réponse inattendue ($code)."
          echo "   503 = la base ne répond pas (projet en pause ?)"
          echo "   → vérifier https://supabase.com/dashboard"
          exit 1
